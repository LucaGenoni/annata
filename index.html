<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annata</title>
<style>
  :root {
    --sfondo: #121318; --sfondo2: #1a1c24; --pannello: #1e2029; --pannello2: #262935; --bordo: #343846;
    --testo: #efe9dd; --tenue: #9ca1b0; --carta: #f4ecdb; --carta-testo: #2a241b;
    --ambra: #e8a33d; --ambra-scuro: #3a2d14; --verde: #4fb286; --rosso: #e0675f; --azzurro: #5aa7c9;
    --raggio: 14px; --ombra: 0 10px 30px rgba(0,0,0,.35);
    --f: clamp(15px, 0.55vw + 10px, 21px);           /* cresce sugli schermi grandi: si legge dal divano */
    --carta-w: clamp(118px, 9vw, 170px);
  }
  * { box-sizing: border-box; }
  html { font-size: var(--f); }
  body { margin: 0; min-height: 100vh; color: var(--testo); font: 1rem/1.45 system-ui, "Segoe UI", sans-serif;
         background: radial-gradient(1200px 600px at 50% -10%, #23202a 0%, var(--sfondo) 60%) fixed, var(--sfondo);
         padding-bottom: 110px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--bordo); background: var(--pannello2);
           border-radius: 999px; padding: .55em 1.1em; transition: transform .08s, border-color .15s, background .15s; }
  button:hover:not(:disabled) { border-color: var(--ambra); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  button.primario { background: var(--ambra); color: #1b1408; border-color: var(--ambra); font-weight: 700; }
  button.grande { font-size: 1.25rem; padding: .7em 1.8em; }
  button.tondo { width: 2.4em; height: 2.4em; padding: 0; border-radius: 50%; }
  button.piccolo { font-size: .8rem; padding: .3em .8em; }
  input, select { font: inherit; color: var(--testo); background: #101117; border: 1px solid var(--bordo); border-radius: 10px; padding: .5em .7em; min-width: 0; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--ambra); outline-offset: 2px; }
  .tenue { color: var(--tenue); font-size: .85rem; }
  .avviso { border-left: 3px solid var(--ambra); padding: .6em .9em; background: #2a2418; border-radius: 8px; font-size: .9rem; margin: .6em 0; }

  /* testata */
  header { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; }
  .logo { font: 700 1.6rem Georgia, serif; color: var(--ambra); letter-spacing: .5px; }
  .logo small { font: .8rem system-ui, sans-serif; color: var(--tenue); margin-left: .5rem; letter-spacing: 0; }
  header .destra { margin-left: auto; display: flex; gap: .5rem; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 1rem 1rem; }

  /* barra del lettore: fissa in basso, il contenuto vero resta coperto */
  #lettore { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); height: 80px;
             border-radius: var(--raggio); overflow: hidden; background: #000; box-shadow: var(--ombra); z-index: 20; }
  #lettore.nascosto { display: none; }
  /* nella schermata «Tocca a …» il player resta caricato ma non si vede: niente tasto play di Spotify prima di
     «Via con la musica» (09/11/2026). visibility e non display, perché l'iframe non si ricarichi */
  #lettore.attesa { visibility: hidden; }
  #velo { position: absolute; inset: 0 64px 0 0; z-index: 2; display: flex; align-items: center; gap: .7em; padding: 0 1.1em;
          background: linear-gradient(90deg, #262935, #1e2029); color: var(--tenue); font-size: .9rem; }
  #velo b { color: var(--ambra); font: 600 1rem Georgia, serif; }
  #lettore.scoperto #velo { display: none; }
  #lettore.yt #velo, #lettore.yt.scoperto #velo { display: flex; inset: 0; }
  #lettore.yt #sp, #lettore:not(.yt) #ytbox { display: none; }
  #ytbox { width: 200px; height: 200px; }

  /* tabellone in alto */
  .tabellone.scorre { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
  .tabellone { display: flex; gap: .6rem; overflow-x: auto; padding: .2rem 0 .6rem; }
  .chip { flex: 0 0 auto; min-width: 11rem; background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: .55rem .8rem; }
  .chip.attivo { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset, 0 0 24px -8px var(--c); }
  .chip .testa { display: flex; align-items: center; gap: .5rem; }
  .avatar { width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--c); color: #15120c; font-weight: 800; display: grid; place-items: center; flex: 0 0 auto; }
  .chip .nome { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 8rem; }
  .chip .punti { margin-left: auto; font: 700 1.1rem Georgia, serif; }
  .progresso { height: 6px; background: #2c2f3b; border-radius: 3px; margin: .45rem 0 .35rem; overflow: hidden; }
  .progresso i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .5s; }
  .chip .sotto { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--tenue); }
  .gettoni { color: var(--ambra); letter-spacing: 2px; }

  /* palco: disco e comandi */
  .palco { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem 2rem; align-items: center; margin: .8rem 0 1.2rem; }
  .disco { --d: clamp(150px, 16vw, 260px); width: var(--d); height: var(--d); border-radius: 50%; border: 0; padding: 0; position: relative;
           background: radial-gradient(circle, var(--ambra) 0 17%, #15120c 17.5% 19%, transparent 19.5%),
                       repeating-radial-gradient(circle, #1b1b1f 0 2px, #26262c 2.5px 4px);
           box-shadow: var(--ombra), inset 0 0 0 6px #0c0c0f; }
  .disco::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                  background: conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.07) 25%, transparent 30% 70%, rgba(255,255,255,.05) 75%, transparent 80%); }
  .disco.gira { animation: gira 3s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .disco .icona { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--d) * .13); color: #15120c; z-index: 1; }
  .disco.gira .icona { animation: gira 3s linear infinite reverse; }   /* l'icona resta dritta */
  .disco:hover:not(:disabled) { border: 0; box-shadow: var(--ombra), inset 0 0 0 6px #0c0c0f, 0 0 0 3px var(--ambra); }
  .regia h1 { font: 700 clamp(1.6rem, 2.4vw, 2.6rem) Georgia, serif; margin: 0 0 .2rem; }
  .regia h1 .nome { color: var(--c); }
  .regia p { margin: .2rem 0 .8rem; color: var(--tenue); }
  .avanzamento { display: flex; align-items: center; gap: .7rem; max-width: 520px; margin-bottom: .9rem; }
  .avanzamento .binario { flex: 1; height: 6px; background: #2c2f3b; border-radius: 3px; overflow: hidden; }
  .avanzamento .binario i { display: block; height: 100%; width: 0; background: var(--ambra); transition: width .45s linear; }
  #tempo { font-variant-numeric: tabular-nums; color: var(--tenue); min-width: 3em; }
  .comandi { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .regia a { color: inherit; text-decoration: none; }
  select.lingua { font-size: .8rem; padding: .35em .6em; border-radius: 999px; background: var(--pannello2); }
  .lingua-turno { margin: 1rem 0 0; font-size: .85rem; color: var(--tenue); }
  .lingua-turno select { margin-left: .4rem; font-size: .85rem; padding: .3em .5em; }   /* i pulsanti dentro un link restano pulsanti, non testo blu */

  /* linea del tempo */
  .linea-titolo { display: flex; align-items: baseline; gap: .6rem; margin: .4rem 0; }
  .linea-titolo h2 { font: 600 1.15rem Georgia, serif; margin: 0; }
  .linea { display: flex; align-items: stretch; gap: .45rem; overflow-x: auto; padding: .6rem .2rem 1rem; scroll-snap-type: x proximity; }
  .carta { flex: 0 0 var(--carta-w); min-height: calc(var(--carta-w) * 1.05); background: var(--carta); color: var(--carta-testo); border-radius: 12px;
           padding: .6rem .7rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 6px 16px rgba(0,0,0,.3); scroll-snap-align: center; }
  .carta .testo { display: flex; flex-direction: column; gap: .15rem; }
  .carta .anno { font: 800 clamp(1.5rem, 2vw, 2.2rem) Georgia, serif; line-height: 1; }
  .carta .tit { font-weight: 700; font-size: .82rem; line-height: 1.2; }
  .carta .tit a { color: inherit; text-decoration: underline; text-decoration-color: var(--bordo); text-underline-offset: 2px; }
  .carta .tit a:hover, .carta .tit a:focus-visible { color: var(--ambra); text-decoration-color: var(--ambra); }
  .carta .art { font-size: .74rem; opacity: .7; line-height: 1.2; }
  .carta.mistero { background: repeating-linear-gradient(135deg, var(--ambra-scuro) 0 10px, #33270f 10px 20px); color: var(--ambra);
                   border: 2px solid var(--ambra); align-items: center; justify-content: center; font: 800 2.6rem Georgia, serif; }
  .carta.rivelata { animation: gira-carta .6s ease-out both; border: 3px solid transparent; }
  .carta.rivelata.ok { border-color: var(--verde); box-shadow: 0 0 0 4px rgba(79,178,134,.25), 0 6px 16px rgba(0,0,0,.3); }
  .carta.rivelata.no { border-color: var(--rosso); box-shadow: 0 0 0 4px rgba(224,103,95,.25); animation: gira-carta .6s ease-out both, scuoti .4s .65s; }
  @keyframes gira-carta { from { transform: perspective(600px) rotateY(90deg); } to { transform: perspective(600px) rotateY(0); } }
  @keyframes scuoti { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .fessura { flex: 0 0 2.6rem; border: 2px dashed #666c7e; border-radius: 12px; background: transparent; padding: 0;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; color: var(--tenue); font-size: 1.3rem; }
  .fessura:disabled, .carta.mistero:disabled { opacity: 1; }
  .fessura:disabled:not(.giusta) { border-color: #2a2d38; }
  .fessura:hover:not(:disabled) { border-color: var(--ambra); color: var(--ambra); background: rgba(232,163,61,.07); }
  .fessura .scritta { display: none; font-size: .85rem; }
  .fessura.giusta { border: 2px solid var(--verde); color: var(--verde); animation: pulsa 1.2s ease-in-out infinite; }
  @keyframes pulsa { 50% { background: rgba(79,178,134,.15); } }
  .gettone-sfida { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #15120c; font-size: .8rem; font-weight: 800; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }

  /* pannelli sotto la linea */
  .azioni { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin-top: .4rem; }
  .esito { font: 700 clamp(1.4rem, 2vw, 2rem) Georgia, serif; margin: .2rem 0; }
  .esito.ok { color: var(--verde); } .esito.no { color: var(--rosso); }
  .scheda-esito { background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: .9rem 1.1rem; margin: .6rem 0; max-width: 760px; }
  .scheda-esito label { display: flex; gap: .5rem; align-items: center; margin: .4rem 0; cursor: pointer; }
  input[type=checkbox], input[type=range] { accent-color: var(--ambra); }   /* caselle e cursori del browser nei colori della pagina */
  .sfidanti { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
  .sfidanti button { display: flex; align-items: center; gap: .5rem; padding: .35em .9em .35em .35em; }
  .sfidanti button.scelto { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--pannello2)); }

  /* schermata di turno */
  .turno { min-height: calc(100vh - 220px); display: grid; place-items: center; text-align: center; }
  .turno .avatar { width: clamp(90px, 10vw, 150px); height: clamp(90px, 10vw, 150px); font-size: clamp(2.5rem, 4vw, 4rem); margin: 0 auto 1rem; box-shadow: 0 0 60px -10px var(--c); }
  .turno h1 { font: 700 clamp(2rem, 4.5vw, 4.5rem) Georgia, serif; margin: 0; }
  .turno h1 span { color: var(--c); }
  .turno p { color: var(--tenue); margin: .6rem 0 1.6rem; }
  .turno .avviso-mazzo, .regia .avviso-mazzo { max-width: 34rem; margin: -.6rem auto 1.4rem; text-align: left; color: var(--testo); }
  .regia .avviso-mazzo { margin: 0 0 .8rem; }
  .appari { animation: appari .35s ease-out both; }
  @keyframes appari { from { opacity: 0; transform: translateY(12px) scale(.98); } }

  /* preparazione */
  .prep { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; margin-top: .5rem; }
  .eroe h1 { font: 700 clamp(2rem, 4vw, 3.4rem) Georgia, serif; margin: .2rem 0; }
  .eroe h1 em { color: var(--ambra); font-style: normal; }
  .eroe p { color: var(--tenue); margin: 0 0 1.2rem; max-width: 36rem; }
  .giocatori { display: grid; gap: .6rem; }
  .riga-g { display: grid; grid-template-columns: auto minmax(0, 1fr) 6.5rem minmax(0, 9rem) auto; gap: .5rem; align-items: center;
            background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: .5rem .6rem; }
  .riga-g input[type=number] { width: 100%; }
  .riquadro { background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: .9rem 1.1rem; }
  .riquadro + .riquadro { margin-top: 1rem; }
  .riquadro.privacy p { margin: .5rem 0 0; }
  .riquadro.privacy a, #nota-anteprima a { color: var(--ambra); text-underline-offset: 2px; }
  details.opzioni { margin: 1rem 0; }
  details.opzioni summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: .6rem; padding: .8rem 1.1rem;
                            background: var(--pannello); border: 1px solid var(--bordo); border-radius: var(--raggio); }
  details.opzioni summary::-webkit-details-marker { display: none; }
  details.opzioni summary::before { content: "▸"; color: var(--ambra); transition: transform .15s; }
  details.opzioni[open] summary::before { transform: rotate(90deg); }
  details.opzioni[open] summary { border-radius: var(--raggio) var(--raggio) 0 0; }
  details.opzioni .corpo { background: var(--pannello); border: 1px solid var(--bordo); border-top: 0; border-radius: 0 0 var(--raggio) var(--raggio); padding: .4rem 1.1rem 1rem; }
  .opz { display: grid; grid-template-columns: 9rem 1fr; gap: .4rem 1rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid #2a2d38; }
  .opz:last-child { border-bottom: 0; }
  .opz[hidden] { display: none; }
  .vite { color: #e0675f; letter-spacing: 2px; }
  .spunte { margin-top: .7rem; }
  .consenso { margin: 1.2rem 0 .2rem; }
  .consenso .tenue { margin: 0 0 .5rem; }
  .spunte .tenue { margin: .35rem 0 0; }
  button.spunta { display: inline-flex; align-items: center; gap: .6rem; padding: .45em 1em .45em .5em; border-radius: 999px; text-align: left; min-height: 44px; }
  button.spunta .segno { flex: none; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; border: 2px solid var(--bordo);
    color: transparent; font-size: .8rem; font-weight: 700; transition: background .15s, border-color .15s, color .15s; }
  button.spunta.on { border-color: var(--ambra); background: var(--ambra-scuro); }
  button.spunta.on .segno { background: var(--ambra); border-color: var(--ambra); color: #1b1408; }
  .vite .spezzato { display: inline-block; font-size: .85em; animation: spezza .7s ease-out; }
  @keyframes spezza { 0% { transform: scale(1.6); } 40% { transform: scale(.85) rotate(-12deg); } 70% { transform: rotate(8deg); } 100% { transform: none; } }
  .scelta-dj { margin-top: .6rem; }
  .scelta-dj p { margin: 0 0 .3rem; }
  #nota-anteprima:empty { display: none; }
  .opz .ctrl { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .opz input[type=number] { width: 5em; }
  .barre { display: grid; grid-template-columns: 5.6em 1fr 2.6em; gap: .3rem .6rem; font-size: .8rem; align-items: center; }
  .barra { height: .7em; background: var(--azzurro); border-radius: 3px; min-width: 2px; }
  dialog { background: var(--pannello); color: var(--testo); border: 1px solid var(--bordo); border-radius: var(--raggio); max-width: min(640px, 92vw); padding: 1.2rem 1.4rem; box-shadow: var(--ombra); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font: 700 1.3rem Georgia, serif; margin: 0 0 .6rem; }
  dialog li { margin: .35rem 0; }

  .solo-lettori { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* scelta della difficoltà */
  .scelta-diff { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin: .4rem 0 1rem; }
  button.diff { border-radius: var(--raggio); text-align: left; padding: .7rem .9rem; background: var(--pannello); }
  button.diff b { display: block; font-size: 1rem; }
  button.diff span { font-size: .78rem; color: var(--tenue); line-height: 1.3; display: block; margin-top: .15rem; }
  button.diff.on { border-color: var(--ambra); background: var(--ambra-scuro); box-shadow: 0 0 0 1px var(--ambra) inset; }
  .etichetta { font: 600 1rem Georgia, serif; margin: 1.2rem 0 .1rem; }
  .quota { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; margin: .4rem 0 .2rem; font-size: .85rem; color: var(--tenue); }
  .quota input[type=range] { width: 100%; accent-color: var(--ambra); }
  .quota input[type=range]:disabled { opacity: .4; }
  .curiosita { color: var(--ambra); font-size: .9rem; margin-top: .2rem; }
  .elenchi-fine { display: flex; flex-wrap: wrap; gap: 0 1.5rem; margin: -.4rem 0 1rem; }
  .elenchi-fine details.saltate { margin-top: 0; }
  details.saltate { margin-top: .8rem; font-size: .88rem; max-width: 520px; }
  details.saltate summary { cursor: pointer; color: var(--tenue); padding: .3rem 0; min-height: 44px; display: flex; align-items: center; }
  details.saltate summary:hover { color: var(--ambra); }
  details.saltate ul { margin: .2rem 0 0; padding: .6rem 1rem .6rem 1.8rem; background: var(--pannello); border: 1px solid var(--bordo); border-radius: 10px; }
  details.saltate li { margin: .15rem 0; }
  details.saltate li a { color: inherit; text-decoration: underline; text-decoration-color: var(--bordo); text-underline-offset: 3px; }
  details.saltate li a:hover, details.saltate li a:focus-visible { color: var(--ambra); text-decoration-color: var(--ambra); }
  details.saltate li b { color: var(--ambra); font-family: Georgia, serif; }
  @media (max-width: 760px) { details.saltate { margin-left: auto; margin-right: auto; text-align: left; } }
  .tasti { font-size: .75rem; color: var(--tenue); margin-top: .6rem; }
  .tasti kbd { border: 1px solid var(--bordo); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; font: inherit; }
  @media (hover: none) {
    .tasti { display: none; }
    button.piccolo, button.tondo { min-height: 44px; min-width: 44px; }
    button, .fessura { min-height: 44px; }   /* bersagli da toccare col dito: «Da capo», «Salta», le fessure, le sfide */
  }

  /* barre di scorrimento in tema. Chrome, Edge e Safari: ::-webkit-scrollbar (forma e colori).
     Firefox: solo i colori (scrollbar-color). Le due cose non vanno mescolate sullo stesso elemento: dal
     Chrome 121, se c'è scrollbar-color/scrollbar-width, ::-webkit-scrollbar viene ignorato. */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3e4c; border-radius: 999px; border: 3px solid var(--sfondo); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ambra); }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* la linea del tempo: cursore ambra su un solco sottile, come la barra di avanzamento della canzone */
  .linea::-webkit-scrollbar { height: 14px; }
  .linea::-webkit-scrollbar-track { background: linear-gradient(transparent 5px, #2c2f3b 5px, #2c2f3b 9px, transparent 9px); margin: 0 6px; }
  .linea::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #f0b45a, var(--ambra) 40%, #c98a2c); border: 3px solid var(--sfondo); border-radius: 999px; }
  .linea::-webkit-scrollbar-thumb:hover { background: #f4c06e; }
  .tabellone::-webkit-scrollbar { height: 10px; }
  .tabellone::-webkit-scrollbar-thumb { background: #3a3e4c; border-width: 2px; }
  @supports not selector(::-webkit-scrollbar) {
    html { scrollbar-color: #3a3e4c var(--sfondo); }
    .linea { scrollbar-color: var(--ambra) #2c2f3b; scrollbar-width: thin; }
    .tabellone { scrollbar-color: #3a3e4c transparent; scrollbar-width: thin; }
  }

  /* guida interattiva */
  #guida { position: fixed; inset: 0; z-index: 50; }
  /* spazio in fondo durante la guida: la pagina può sempre scorrere fin dove serve perché il fumetto non copra
     l'elemento (su un telefono basso la scheda dell'esito, in fondo alla pagina, finiva sotto il fumetto) */
  body.in-guida { padding-bottom: 100vh; }
  #guida .blocco { position: absolute; inset: 0; }
  #guida .faro { position: fixed; border: 3px solid var(--ambra); border-radius: 14px; pointer-events: none;
                 box-shadow: 0 0 0 9999px rgba(8, 9, 12, .74), 0 0 30px 4px rgba(232, 163, 61, .45); transition: all .3s ease; }
  #guida .fumetto { position: fixed; width: min(420px, calc(100vw - 32px)); background: var(--pannello2); border: 1px solid var(--ambra);
                    border-radius: var(--raggio); padding: 1rem 1.1rem; box-shadow: var(--ombra); transition: top .3s ease, left .3s ease; }
  #guida .fumetto .conta { font-size: .75rem; color: var(--tenue); letter-spacing: .04em; }
  #guida .fumetto h3 { font: 700 1.1rem Georgia, serif; margin: .2rem 0 .3rem; color: var(--ambra); }
  #guida .fumetto p { margin: 0 0 .9rem; }
  #guida .fumetto .bottoni { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
  #guida .fumetto .esci { margin-right: auto; }
  #guida .puntini { display: flex; gap: 4px; margin: .1rem 0 .6rem; }
  #guida .puntini i { width: 6px; height: 6px; border-radius: 50%; background: var(--bordo); }
  #guida .puntini i.on { background: var(--ambra); }
  @media (max-width: 760px) { #guida .fumetto { right: 16px; width: auto; } }
  .link-guida { background: none; border: 0; padding: 0; color: var(--ambra); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }

  /* fine */
  .podio { text-align: center; margin: 1rem 0 1.5rem; }
  .podio h1 { font: 700 clamp(2.2rem, 5vw, 4.5rem) Georgia, serif; margin: .2rem 0; }
  .podio h1 span { color: var(--c); }
  canvas#coriandoli { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  /* telefono: tutto in colonna, linea del tempo verticale */
  @media (max-width: 760px) {
    body { padding-bottom: 104px; }
    .prep { grid-template-columns: 1fr; }
    .riga-g { grid-template-columns: auto minmax(0, 1fr) 5.2rem auto; }
    .riga-g select { grid-column: 2 / 4; }
    .opz { grid-template-columns: 1fr; }
    .palco { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 1rem; }
    .avanzamento, .comandi { margin-left: auto; margin-right: auto; justify-content: center; }
    .avanzamento { width: 100%; }
    .regia { width: 100%; }
    .logo small { display: none; }
    header .destra button.piccolo { white-space: nowrap; }
    .tabellone { scrollbar-width: none; }
    .tabellone::-webkit-scrollbar { display: none; }
    .chip { min-width: 9.5rem; }
    .linea-titolo { flex-direction: column; align-items: flex-start; gap: .1rem; }
    .scelta-diff { grid-template-columns: 1fr; }
    /* su telefono il bottone principale resta a portata di pollice, sopra la barra del lettore */
    .azioni { position: sticky; bottom: 100px; z-index: 10; padding: .4rem 0; }
    .azioni .grande { box-shadow: 0 6px 20px rgba(0,0,0,.5); }
    .linea { flex-direction: column; overflow-x: visible; padding: .4rem 0; }
    .carta { flex: 0 0 auto; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: .8rem; padding: .6rem .8rem; }
    .carta .anno { font-size: 1.6rem; min-width: 3.2ch; }
    .carta .testo { display: flex; flex-direction: column; }
    .carta.mistero { font-size: 1.8rem; justify-content: center; min-height: 3.2rem; }
    .fessura { flex: 0 0 auto; min-height: 2.6rem; flex-direction: row; }
    .fessura .scritta { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="logo">Annata<small data-t="testata.motto"></small></span>
  <span class="destra" id="testata"></span>
</header>
<main id="app"></main>
<div id="annuncio" class="solo-lettori" role="status" aria-live="polite"></div>
<div id="lettore" class="nascosto"><div id="velo"><b data-t="lettore.mistero"></b><span id="velo-fonte"></span></div>
  <div id="sp"><div id="embed"></div></div><div id="ytbox"><div id="yt"></div></div></div>

<!-- I testi delle finestre e di tutta la pagina stanno in lingue/<lingua>.json: data-t è il codice del testo -->
<dialog id="regole">
  <h2 data-t="regole.titolo"></h2>
  <ul>
    <li data-t="regole.linea"></li>
    <li data-t="regole.turno"></li>
    <li data-t="regole.carta"></li>
    <li data-t="regole.gettoni"></li>
    <li data-t="regole.bonus"></li>
    <li data-t="regole.vince"></li>
    <li data-t="regole.solo"></li>
    <li data-t="regole.senzaCookie"></li>
  </ul>
  <p style="text-align:right"><button class="primario" onclick="this.closest('dialog').close()" data-t="regole.ok"></button></p>
</dialog>
<dialog id="conferma">
  <h2 data-t="conferma.titolo"></h2>
  <p class="tenue" data-t="conferma.testo"></p>
  <p style="display:flex;gap:.6rem;justify-content:flex-end">
    <button onclick="this.closest('dialog').close()" data-t="conferma.no"></button>
    <button class="primario" onclick="this.closest('dialog').close();chiudiPartita()" data-t="conferma.si"></button></p>
</dialog>

<script>
/* YouTube blocca quasi tutta la musica incorporata (errore 150) se la pagina sta su un IP nudo come 127.0.0.1,
   mentre su "localhost" la stessa canzone parte: verificato l'08/11/2026, 13 canzoni su 15 bloccate contro 0 su 20.
   L'hub e i vecchi collegamenti aprono 127.0.0.1, quindi la pagina si sposta da sola, portandosi dietro
   la partita salvata (il localStorage è separato per ogni indirizzo). */
(function () {
  const K = ["annata-partita-v2", "annata-partita-v1", "annata-setup-v1", "annata-lingua", "annata-record-solo-v1", "annata-spotify-ok"];
  if (location.hostname === "127.0.0.1") {
    const dati = {};
    try { for (const k of K) { const v = localStorage.getItem(k); if (v) dati[k] = v; } } catch (e) { /* niente */ }
    location.replace(`${location.protocol}//localhost:${location.port}${location.pathname}#trasloco=${encodeURIComponent(JSON.stringify(dati))}`);
    window.ANNATA_TRASLOCO = true;              // lo script principale non parte: la pagina si ricarica dall'altra parte
    return;
  }
  const m = location.hash.match(/^#trasloco=(.*)$/);
  if (m) {
    try {
      const dati = JSON.parse(decodeURIComponent(m[1]));
      for (const k of K) if (dati[k] && !localStorage.getItem(k)) localStorage.setItem(k, dati[k]);
    } catch (e) { /* niente */ }
    history.replaceState(null, "", location.pathname);
  }
})();
</script>

<script>
"use strict";
/* ---------- lingue ----------
   Ogni testo che vede chi gioca sta in lingue/<lingua>.json con un codice: t("codice", {parametri}).
   I parametri si scrivono {nome} nel testo. Un testo con singolare e plurale è un oggetto con le forme di
   Intl.PluralRules ("one", "other", ...) e si sceglie con il parametro n. Il file unico porta i pacchetti
   compressi in window.ANNATA_LINGUE (vedi compila.py). */
let LINGUA = {}, LOCALE = "it-IT", PLURALI = null;
function t(k, p) {
  let v = LINGUA[k];
  if (v === undefined) { console.warn("Testo mancante nel pacchetto lingue: " + k); return k; }
  if (v && typeof v === "object" && !Array.isArray(v)) v = v[PLURALI.select(p && p.n !== undefined ? p.n : 0)] ?? v.other;
  return p ? String(v).replace(/\{(\w+)\}/g, (m, x) => p[x] !== undefined ? p[x] : m) : v;
}
const testi = k => LINGUA[k] || [];               // liste e oggetti del pacchetto (frasi, passi della guida)
// elenchi («Italia, Francia e Germania») e percentuali («40%», in francese «40 %») li formatta il browser per ogni lingua
const elenco = v => new Intl.ListFormat(LOCALE, { style: "long", type: "conjunction" }).format(v);
const percento = x => new Intl.NumberFormat(LOCALE, { style: "percent", maximumFractionDigits: 0 }).format(x);
/* Lingue della pagina: quelle dei paesi che si possono scegliere. Ognuno gioca il suo turno nella lingua del suo paese
   (o in quella scelta nella schermata «Tocca a …»); preparazione, guida e fine sono nella lingua della pagina. */
const LINGUE = ["it", "en", "fr", "es", "de"];
const LINGUA_PAESE = { IT: "it", US: "en", GB: "en", FR: "fr", ES: "es", DE: "de" };
const CHIAVE_LINGUA = "annata-lingua";
let PACCHETTI = {}, LINGUA_PAGINA = "it", LINGUA_ATTIVA = null;
function usaLingua(codice) {
  if (codice === LINGUA_ATTIVA || !PACCHETTI[codice]) return;
  LINGUA = PACCHETTI[codice]; LINGUA_ATTIVA = codice;
  LOCALE = LINGUA._locale || codice;
  PLURALI = new Intl.PluralRules(LOCALE);
  applicaTestiFissi();
}
const linguaDi = g => PACCHETTI[g.lingua] ? g.lingua : PACCHETTI[LINGUA_PAESE[g.paese]] ? LINGUA_PAESE[g.paese] : LINGUA_PAGINA;
function linguaDelMomento() {
  return !GUIDA && S && S.fase === "gioco" && S.opzioni.linguaGiocatore !== false ? linguaDi(attivo()) : LINGUA_PAGINA;
}
const piuLingue = () => Object.keys(PACCHETTI).length > 1;
const menuLingue = scelta => LINGUE.filter(k => PACCHETTI[k]).map(k => `<option value="${k}" ${k === scelta ? "selected" : ""}>${PACCHETTI[k]._nome}</option>`).join("");
function scegliLinguaPagina(k) { LINGUA_PAGINA = k; try { localStorage.setItem(CHIAVE_LINGUA, k); } catch (e) { /* niente */ } render(); }
function scegliLinguaGiocatore(k) { attivo().lingua = k; salva(); render(); }
function applicaTestiFissi() {                   // i testi scritti nell'HTML: data-t="codice"
  document.documentElement.lang = LINGUA._lingua || "it";
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
}

const PAESI = ["IT", "FR", "ES", "DE", "AT", "BE", "CH", "GB", "IE", "US", "CA", "SE", "NO", "DK", "PR", "CO", "BR", "AU", "NZ", "KR", "XX"];
const nomePaese = k => PAESI.includes(k) ? t("paese." + k) : k;

const PAESI_SCELTA = ["IT", "US", "GB", "FR", "ES", "DE", "XX"];
const paeseValido = k => PAESI_SCELTA.includes(k) ? k : "XX";

const MODALITA = {

  Object.assign(faro.style, { display: "block", left: `${r.left - m}px`, top: `${alto}px`, width: `${r.width + 2 * m}px`, height: `${Math.max(0, basso - alto)}px` });
  fum.style.top = `${top}px`;
  fum.style.left = telefono ? `${bordo}px` : `${Math.min(innerWidth - w - bordo, Math.max(bordo, r.left + r.width / 2 - w / 2))}px`;
}
function chiudiGuida(apriRegole) {
  if (!GUIDA) return;
  const g = GUIDA;
  document.getElementById("guida")?.remove();
  document.body.classList.remove("in-guida");
  CANZONI.length = g.base;               // via le carte della guida
  S = JSON.parse(g.salvato);
  FONTE = g.fonte;
  document.getElementById("lettore").className = g.classeLettore;
  GUIDA = null;
  render();
  window.scrollTo(0, g.scorrimento);
  if (apriRegole) document.getElementById("regole").showModal();
  else if (g.focus && g.focus.focus) g.focus.focus({ preventScroll: true });
}
window.addEventListener("resize", () => posizionaGuida(false));
window.addEventListener("scroll", () => posizionaGuida(false), { passive: true });
document.addEventListener("keydown", e => {
  if (!GUIDA) return;
  if (e.key === "Escape") { e.preventDefault(); chiudiGuida(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") {
    if (e.key === "Enter" && e.target.tagName === "BUTTON") return;   // l'Invio su un pulsante fa già il suo clic
    e.preventDefault();
    if (GUIDA.passo < PASSI_GUIDA.length - 1) mostraPassoGuida(GUIDA.passo + 1); else chiudiGuida();
  } else if (e.key === "ArrowLeft") { e.preventDefault(); mostraPassoGuida(GUIDA.passo - 1); }
  else if (e.key === "Tab") {             // il focus resta nel fumetto
    const b = [...document.querySelectorAll("#guida .fumetto button")];
    const i = b.indexOf(document.activeElement);
    e.preventDefault();
    b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length]?.focus();
  }
});

function descriviFessura(linea, k) {
  const prima = k > 0 ? canzone(linea[k - 1]).anno : null, dopo = k < linea.length ? canzone(linea[k]).anno : null;
  if (prima === null && dopo === null) return t("fessura.qui");
  if (prima === null) return t("fessura.prima", { anno: dopo });
  if (dopo === null) return t("fessura.dopo", { anno: prima });

const MINIMO_CANZONI = 40;
function canzoniPossibili() {
  return pesiMazzo(insieme(), S.giocatori, S.opzioni.adatta, S.opzioni.difficolta, S.opzioni.quotaNaz).filter(x => x > 0).length;
}
function anteprima() {
  const box = document.getElementById("anteprima"); if (!box) return;
  const gioc = S.giocatori, idx = insieme(), nazionali = paesiNazionali(gioc);
  const pesi = pesiMazzo(idx, gioc, S.opzioni.adatta, S.opzioni.difficolta, S.opzioni.quotaNaz);
  const tot = pesi.reduce((a, b) => a + b, 0) || 1, possibili = pesi.filter(x => x > 0).length;
  const decenni = {}, gruppi = { naz: 0, int: 0 };
  idx.forEach((i, n) => {
    if (!pesi[n]) return;
    const c = CANZONI[i], d = fascia(c.anno);
    decenni[d] = (decenni[d] || 0) + pesi[n];
    gruppi[classifica(c, nazionali).naz ? "naz" : "int"] += pesi[n];
  });
  const maxD = Math.max(1e-9, ...Object.values(decenni));
  const avviso = possibili < MINIMO_CANZONI
    ? `<p class="avviso">${t(solo() ? "anteprima.poche.solo" : "anteprima.poche", { n: possibili })}</p>` : "";
  box.innerHTML = `<p class="tenue">${t("anteprima.anni", { n: possibili.toLocaleString(LOCALE) })}</p>
    <div class="barre">${Object.keys(decenni).sort().map(d => `<span>${d == 1950 ? t("anteprima.fino59") : t("anteprima.decennio", { d: String(d).slice(2) })}</span>
      <div class="barra" style="width:${(decenni[d] / maxD * 100).toFixed(0)}%"></div><span>${percento(decenni[d] / tot)}</span>`).join("")}</div>
    ${nazionali.length ? `<p class="tenue">${Object.entries(gruppi).map(([k, v]) => t("anteprima.gruppo", { nome: t(k === "naz" && solo() ? "anteprima.naz.solo" : "anteprima." + k), pct: percento(v / tot) })).join(" · ")}</p>` : ""}${avviso}`;
  const via = document.getElementById("pulsante-via");
  if (via) via.disabled = possibili < S.giocatori.length + 5;
  const testo = document.getElementById("testo-quota"); if (testo) testo.textContent = testoQuota(gruppi.naz / tot);
}
/* La riga sotto il cursore dice la quota vera del mazzo, non quella del cursore: nei decenni in cui un paese non ha
   classifiche escono solo internazionali, e un tavolo spagnolo col cursore al 60% ne riceve il 44% (simulato il 09/11/2026). */
function testoQuota(reale) {
  const naz = paesiNazionali(S.giocatori), v = Math.round((S.opzioni.quotaNaz ?? 0.6) * 100);
  if (!naz.length) return t(solo() ? "quota.nessuno.solo" : "quota.nessuno");
  const nomi = elenco(naz.map(nomePaese));
  if (v === 100) return t("quota.tutte", { elenco: nomi });
  if (v === 0) return t("quota.zero");
  const q = Number.isFinite(reale) ? Math.round(reale * 100) / 100 : v / 100;
  return t("quota.circa", { v: percento(q), r: percento(1 - q), elenco: nomi });
}
function scegliQuota(v, definitivo) {
  S.opzioni.quotaNaz = v / 100;
  anteprima();                                 // aggiorna anche la riga della quota
  if (definitivo) salva();
}

function lineaHtml(g, interattiva) {

      const scelta = S.posizione === k, sf = S.sfide.find(s => s.fessura === k);
      if (scelta && S.passo === "rivela") h += cartaHtml(c, "rivelata " + (S.esito.giusto ? "ok" : "no"));
      else if (scelta) h += `<button class="carta mistero" onclick="scegliFessura(${k})" ${S.passo === "ascolta" ? "" : "disabled"} title="${t("linea.mistero.title")}" aria-label="${t("linea.mistero.aria", { dove: descriviFessura(g.linea, k) })}">?</button>`;
      else {
        const giusta = S.passo === "rivela" && !S.esito.giusto && fessuraValida(g.linea, k, c.anno);
        const cliccabile = S.passo === "ascolta" || (S.passo === "sfide" && S.sfidante !== null && !sf);
        const dentro = sf ? `<span class="gettone-sfida" style="--c:${colore(sf.g)}">${sigla(S.giocatori[sf.g].nome)}</span>`
          : giusta ? `✓<span class="scritta">${t("linea.andavaQui")}</span>` : `+<span class="scritta">${descriviFessura(g.linea, k)}</span>`;
        h += `<button class="fessura ${giusta ? "giusta" : ""}" ${cliccabile ? `onclick="scegliFessura(${k})"` : "disabled"} aria-label="${t("linea.metti", { dove: descriviFessura(g.linea, k) })}" title="${descriviFessura(g.linea, k)}">${dentro}</button>`;
      }
    }
    if (k < g.linea.length) h += cartaHtml(canzone(g.linea[k]), "", !interattiva);
  }
  return `<div class="linea">${h}</div>`;
}

/* Cuori della partita da soli. La vita si toglie davvero con «Avanti» (prossimoTurno), ma appena la carta si gira
   e si vede che è persa l'ultimo cuore pieno diventa un cuore spezzato (scelta dell'11/11/2026). In Pro ed
   Esperto la carta è persa anche col posto giusto se nessuno spunta la casella: il cuore segue la casella. */
const cartaPersa = () => S.fase === "gioco" && S.passo === "rivela" && S.esito && (!S.esito.giusto || (MODALITA[S.opzioni.modalita].serve && !S.nominato));
function viteHtml() {

}
function aggiornaVite() { const el = document.querySelector(".tabellone .vite"); if (el) el.outerHTML = viteHtml(); }
function tabelloneHtml() {
  const o = S.opzioni, aVite = S.vite != null;   // da soli: al posto del traguardo il record da battere, e le vite
  const meta = aVite ? S.record || 0 : o.obiettivo;
  const vite = aVite ? viteHtml() : "";
  return `<div class="tabellone">${S.giocatori.map((x, i) => `<div class="chip ${i === S.turno && S.fase === "gioco" ? "attivo" : ""}" style="--c:${colore(i)}">

      <div class="progresso"><i style="width:${meta ? Math.min(100, x.linea.length / meta * 100) : 0}%"></i></div>
      ${o.usaGettoni || aVite ? `<div class="sotto">${vite}${o.usaGettoni ? `<span class="gettoni" role="img" aria-label="${t("tabellone.gettoni", { n: x.gettoni })}" title="${t("tabellone.gettoni", { n: x.gettoni })}">${"●".repeat(Math.max(0, x.gettoni))}${"○".repeat(Math.max(0, o.max - x.gettoni))}</span>
        ${S.fase === "gioco" ? `<button class="piccolo" style="margin-left:auto" onclick="compra(${i})" ${puoComprare(x) ? "" : "disabled"} title="${t("tabellone.compra.title")}">${t("tabellone.compra")}</button>` : ""}` : ""}</div>` : ""}
    </div>`).join("")}</div>`;

    </div>
    ${ord.map(({ g, i }) => `<div class="linea-titolo"><span class="avatar" style="--c:${colore(i)}">${iniziale(g.nome)}</span><h2>${esc(g.nome)}</h2><span class="tenue">${riassuntoGiocatore(i, g)}</span></div>${lineaHtml(g, false)}${elenchiFine(i)}`).join("")}`;

/* Riepilogo di fine partita: la linea mostra le carte tenute; qui sotto, a scomparsa, sbagliate e saltate */
function riassuntoGiocatore(i, g) {
  const s = (S.storia || []).filter(x => x.g === i), conta = e => s.filter(x => x.esito === e).length;
  const pezzi = [t("fine.carte", { n: g.linea.length })];
  for (const esito of ["giusta", "rubata", "comprata", "sbagliata", "saltata"]) {
    const n = conta(esito);
    if (n) pezzi.push(t("fine." + esito, { n }));
  }
  return pezzi.join(" · ");
}
function elenchiFine(i) {
  const s = (S.storia || []).filter(x => x.g === i);
  const riga = x => rigaCanzone(canzone(x.carta));
  const blocco = (esito, codice) => {
    const v = s.filter(x => x.esito === esito);
    return v.length ? `<details class="saltate"><summary>${t(codice, { n: v.length })}</summary><ul>${v.map(riga).join("")}</ul></details>` : "";
  };
  const h = blocco("sbagliata", "fine.elenco.sbagliate") + blocco("saltata", "fine.elenco.saltate");
  return h ? `<div class="elenchi-fine">${h}</div>` : "";
}

function coriandoli() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.id = "coriandoli"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const pezzi = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .5, v: 2 + Math.random() * 3,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .2, c: COLORI[Math.floor(Math.random() * COLORI.length)], w: 6 + Math.random() * 6 }));
  const t0 = performance.now();
  (function passo(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of pezzi) { p.y += p.v; p.x += Math.sin((t + p.y) / 300); p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -3, p.w, 6); ctx.restore(); }
    if (t - t0 < 4500) requestAnimationFrame(passo); else cv.remove();
  })(t0);
}

/* ---------- avvio ---------- */
const FILE_UNICO = !!window.ANNATA_GZ;
// file unico: catalogo e pacchetti lingue sono JSON compressi con gzip e messi in base64 (vedi compila.py)
async function scompattaJson(b64) {
  const byte = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([byte]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function scompatta(b64) {              // catalogo: a colonne (una lista per campo), rimesso in oggetti
  const d = await scompattaJson(b64);
  if (d.righe) return d.righe.map(r => Object.fromEntries(d.campi.map((k, i) => [k, r[i]])));   // file unico di prima del 09/11/2026
  const campi = Object.keys(d.colonne), n = d.colonne[campi[0]].length;
  return Array.from({ length: n }, (_, i) => Object.fromEntries(campi.map(k => [k, d.colonne[k][i]])));
}
const LINGUA_BASE = "it";
async function leggiPacchetto(codice) {
  if (window.ANNATA_LINGUE) return window.ANNATA_LINGUE[codice] ? scompattaJson(window.ANNATA_LINGUE[codice]) : null;
  const r = await fetch(`lingue/${codice}.json`, { cache: "no-store" });
  return r.ok ? r.json() : null;
}
async function caricaLingue() {
  // Tutte subito (circa 6 KB l'una): si cambia lingua a ogni turno senza attese. Una traduzione incompleta non rompe
  // la pagina: i testi che le mancano si prendono dall'italiano. Una lingua che non si carica sparisce dal menu.
  const base = await leggiPacchetto(LINGUA_BASE);
  if (!base) throw new Error("manca il pacchetto di base");
  PACCHETTI = { [LINGUA_BASE]: base };
  await Promise.all(LINGUE.filter(k => k !== LINGUA_BASE).map(async k => {
    try { const p = await leggiPacchetto(k); if (p) PACCHETTI[k] = Object.assign({}, base, p); } catch (e) { /* niente */ }
  }));
  let salvata = null;
  try { salvata = localStorage.getItem(CHIAVE_LINGUA); } catch (e) { /* niente */ }
  const browser = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => PACCHETTI[l]);
  LINGUA_PAGINA = PACCHETTI[salvata] ? salvata : browser || LINGUA_BASE;
  usaLingua(LINGUA_PAGINA);
}
(async function () {
  if (window.ANNATA_TRASLOCO) return;          // la pagina si sta spostando da 127.0.0.1 a localhost
  try {
    await caricaLingue();
  } catch (e) {                               // senza pacchetto non c'è nessun testo da mostrare: solo il nome del file
    app.innerHTML = `<p class="avviso">⚠ lingue/${LINGUA_BASE}.json</p>`;
    return;
  }
  try {
    if (window.ANNATA_GZ) CANZONI = await scompatta(window.ANNATA_GZ);   // file unico (compila.py)
    else {
      const r = await fetch("canzoni.json", { cache: "no-store" });
      CANZONI = (await r.json()).canzoni;
    }
    CANZONI.forEach(prepara);
    INDICE = new Map(CANZONI.map((c, i) => [chiaveCarta(i), i]));
  } catch (e) {
    app.innerHTML = `<p class="avviso">${t("errore.catalogo")}</p>`;
    return;
  }
  // partita salvata col formato di prima (posizioni nel catalogo): non si riprende, si avvisa una volta
  try { if (localStorage.getItem(CHIAVE_VECCHIA)) { localStorage.removeItem(CHIAVE_VECCHIA); PARTITA_PERSA = true; } } catch (e) { /* niente */ }
  caricaSalvata();                             // scopre subito anche una v2 che non torna più col catalogo
  const base = statoIniziale(), setup = leggiChiave(CHIAVE_SETUP);
  S = { fase: "setup", giocatori: setup ? setup.giocatori.map(g => ({ nome: g.nome, nascita: leggiNascita(g.nascita), paese: paeseValido(g.paese), ...(g.lingua ? { lingua: g.lingua } : {}) })) : base.giocatori,
        opzioni: normalizzaOpzioni(Object.assign(base.opzioni, setup ? setup.opzioni : {})) };
  render();
  if (CONSENSO) caricaApiSpotify();
})();
</script>
</body>
</html>
